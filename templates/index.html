<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection From MRI Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #0b4ea2;
        }
        .box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }
        .box h2 {
            margin-top: 0;
            color: #0b4ea2;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .preview {
            text-align: center;
            margin: 10px 0;
        }
        .preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            display: none;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #0b4ea2;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #0ea5e9;
        }
        #loading {
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        #loading img {
            width: 50px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        table th {
            background: #0b4ea2;
            color: #fff;
            width: 40%;
        }
        table img {
            max-width: 100px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Brain Tumor Detection From MRI Image</h1>

        <div class="box">
            <h2>Patient Details</h2>
            <form id="diagForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter patient name" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile</label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter age" min="1" max="120" required>
                </div>
                <div class="form-group">
                    <label for="mriscan">Upload MRI Scan</label>
                    <input type="file" id="mriscan" accept="image/*" onchange="previewMRI()" required>
                </div>
                <div class="preview">
                    <img id="mriPreview" alt="MRI Preview">
                </div>
                <button type="button" onclick="submitDetails()">Detect Brain Tumor</button>
                <div id="loading">
                    <img src="/static/spinner.gif" alt="Loading...">
                    <p>Analyzing image...</p>
                </div>
            </form>
        </div>

        <div class="box" id="resultBox" style="display:none;">
            <h2>Detection Result</h2>
            <table>
                <tbody id="resultBody"></tbody>
            </table>
            <br>
            <button onclick="window.print()">Print Report</button>
        </div>
    </div>

    <script>
        function previewMRI() {
            const file = document.getElementById('mriscan').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                const img = document.getElementById('mriPreview');
                img.src = reader.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function submitDetails() {
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value.trim();
            const file = document.getElementById('mriscan').files[0];

            if (!name || !mobile || !gender || !age || !file) {
                alert("Please fill in all fields and upload the MRI image.");
                return;
            }
            if (!/^[0-9]{10}$/.test(mobile)) {
                alert("Mobile number must be 10 digits.");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('loading').style.display = 'block';

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const rows = [
                    ['Name', name],
                    ['Mobile', '+91 ' + mobile],
                    ['Gender', gender],
                    ['Age', age],
                    ['MRI Scan', '<img src="' + document.getElementById('mriPreview').src + '" alt="MRI Scan">'],
                    ['Result', data.prediction],
                    ['Confidence', data.confidence]
                ];
                document.getElementById('resultBody').innerHTML = rows.map(r =>
                    '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'
                ).join('');

                const box = document.getElementById('resultBox');
                box.style.display = 'block';
                box.scrollIntoView({ behavior: 'smooth' });
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        }
    </script>
</body>
</html>
